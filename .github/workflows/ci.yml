# Lint and test the canary itself on every push and pull request: Python lint,
# unit tests, the batch plan, and the workflows themselves (actionlint for
# correctness, zizmor for security).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.26" # uv itself, pinned too: the action defaults to the latest
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q
      - name: The batch plan lists every state
        run: uv run python -m canary plan | python3 -c 'import json,sys; assert len(json.load(sys.stdin)) == 25'
      - name: Lint the workflows
        run: |
          uv run actionlint
          uv run zizmor --offline .github/workflows
